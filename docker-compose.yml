version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DATABASE_URL=${DATABASE_URL}
      - ENABLE_WORKER=true
      - USE_QUEUE=true
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always
